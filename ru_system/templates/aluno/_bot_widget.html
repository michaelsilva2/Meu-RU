<!-- Widget Bot do RU — incluído em todas as páginas do aluno -->
<div id="bot-widget" class="fixed bottom-6 right-6 z-50 flex flex-col items-end gap-3">

    <!-- Janela do chat -->
    <div id="bot-janela" class="hidden rounded-2xl overflow-hidden shadow-2xl flex flex-col" style="width: 390px; border: 1px solid #F4792022; max-height: 90vh;">

        <!-- Header -->
        <div class="px-4 py-3.5 flex items-center gap-3 flex-shrink-0" style="background: linear-gradient(135deg, #1A0D05, #2C1508);">
            <div class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0" style="background: #F4792030;">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" style="color: #F47920;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
            </div>
            <div class="flex-1">
                <p class="text-sm font-bold uppercase tracking-widest" style="color: #fff;">Assistente&nbsp;&nbsp;RU</p>
                <div class="flex items-center gap-1.5 mt-0.5">
                    <span class="w-2 h-2 rounded-full bg-green-400"></span>
                    <p class="text-xs" style="color: rgba(255,255,255,0.55);">Online agora</p>
                </div>
            </div>
            <button onclick="fecharBot()" class="text-white/40 hover:text-white transition text-2xl leading-none">&times;</button>
        </div>

        <!-- Mensagens -->
        <div id="bot-chat" class="flex-1 p-4 space-y-3 overflow-y-auto bot-surface" style="min-height: 300px;"></div>

        <!-- Quick replies -->
        <div id="bot-replies" class="px-3 pb-4 pt-2 flex flex-col gap-2 flex-shrink-0 overflow-y-auto bot-surface" style="border-top: 1px solid #F4792018; max-height: 280px;"></div>
    </div>

    <!-- Botão flutuante -->
    <button onclick="toggleBot()"
        class="w-14 h-14 rounded-full shadow-xl flex items-center justify-center transition-all duration-200"
        style="background: linear-gradient(135deg, #F47920, #E03D3D);"
        onmouseover="this.style.transform='scale(1.1)'; this.style.boxShadow='0 8px 25px #F4792060';"
        onmouseout="this.style.transform='scale(1)'; this.style.boxShadow='';">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-3 3-3-3z"/>
        </svg>
    </button>
</div>

<script>
let botAberto = false, botIniciado = false;

const BOT_ICON = `<div class="w-6 h-6 rounded-lg flex-shrink-0 flex items-center justify-center" style="background:linear-gradient(135deg,#F47920,#E03D3D);">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-3 3-3-3z"/>
    </svg></div>`;

function toggleBot() {
    const janela = document.getElementById('bot-janela');
    if (botAberto) { fecharBot(); return; }
    janela.classList.remove('hidden');
    botAberto = true;
    if (!botIniciado) { botIniciado = true; setTimeout(iniciarBot, 400); }
}

function fecharBot() {
    document.getElementById('bot-janela').classList.add('hidden');
    botAberto = false;
}

function iniciarBot() {
    addMsgBot('Olá! 👋 No que posso te ajudar hoje?');
    setTimeout(() => mostrarOpcoes(opcoesMenu()), 600);
}

function opcoesMenu() {
    return [
        { icone: '🌞', label: 'Cardápio do Almoço', acao: () => verCardapio('almoco') },
        { icone: '🌙', label: 'Cardápio do Jantar',  acao: () => verCardapio('jantar') },
        { icone: '📅', label: 'Cardápio do Almoço de Amanhã', acao: () => verCardapio('almoco', 'amanha') },
        { icone: '⏰', label: 'Horários do RU',      acao: verHorarios },
        { icone: '🧾', label: 'Minhas últimas refeições', acao: verUltimasRefeicoes },
        { icone: '📱', label: 'Como usar o código de acesso', acao: verComoFuncionaCodigo },
        { icone: '💳', label: 'Como recarregar créditos', acao: verComoRecarregar },
        { icone: '⭐', label: 'Avaliar minha última refeição', acao: verAvaliacao },
        { icone: '💡', label: 'Mandar uma sugestão', acao: verSugestao },
        { icone: '💬', label: 'Falar com o RU', acao: verContato },
    ];
}

function voltarMenu() {
    setTimeout(() => mostrarOpcoes([{ voltar: true, label: 'Voltar ao menu', acao: () => {
        mostrarOpcoes([]);
        setTimeout(() => { addMsgBot('O que mais posso te ajudar? 😊'); setTimeout(() => mostrarOpcoes(opcoesMenu()), 400); }, 300);
    }}]), 400);
}

function addMsgBot(html) {
    const chat = document.getElementById('bot-chat');
    const div = document.createElement('div');
    div.className = 'flex items-end gap-2';
    div.innerHTML = `${BOT_ICON}<div class="max-w-[280px] px-4 py-3 rounded-2xl rounded-bl-sm leading-relaxed bot-bubble-bot">${html}</div>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function addMsgUser(texto) {
    const chat = document.getElementById('bot-chat');
    const div = document.createElement('div');
    div.className = 'flex justify-end';
    div.innerHTML = `<div class="max-w-[280px] px-4 py-3 rounded-2xl rounded-br-sm text-white font-medium" style="background:linear-gradient(135deg,#F47920,#E03D3D);font-size:15px;font-family:Inter,sans-serif;">${texto}</div>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

async function digitando() {
    const chat = document.getElementById('bot-chat');
    const div = document.createElement('div');
    div.id = 'bot-typing';
    div.className = 'flex items-end gap-2';
    div.innerHTML = `${BOT_ICON}<div class="px-3 py-2.5 rounded-2xl rounded-bl-sm flex gap-1 bot-bubble-bot">
        <span class="w-1.5 h-1.5 rounded-full" style="background:#F47920;animation:bounce 1s infinite 0ms;"></span>
        <span class="w-1.5 h-1.5 rounded-full" style="background:#F47920;animation:bounce 1s infinite 200ms;"></span>
        <span class="w-1.5 h-1.5 rounded-full" style="background:#F47920;animation:bounce 1s infinite 400ms;"></span>
    </div>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    await new Promise(r => setTimeout(r, 800));
    div.remove();
}

function mostrarOpcoes(opcoes) {
    const box = document.getElementById('bot-replies');
    box.innerHTML = '';
    opcoes.forEach(op => {
        const btn = document.createElement('button');
        if (op.voltar) {
            btn.className = 'bot-voltar-btn';
            btn.innerHTML = `<span style="font-size:14px;">↩</span><span>Voltar ao menu</span>`;
        } else {
            btn.className = 'bot-option-btn';
            btn.innerHTML = `
                <span class="bot-option-icon">${op.icone}</span>
                <span class="bot-option-label">${op.label}</span>
                <span class="bot-option-arrow">›</span>`;
        }
        btn.onclick = async () => {
            mostrarOpcoes([]);
            addMsgUser(op.voltar ? op.label : `${op.icone} ${op.label}`);
            await digitando();
            op.acao();
        };
        box.appendChild(btn);
    });
}

async function verCardapio(tipo, dia = 'hoje') {
    try {
        const res = await fetch(`/aluno/cardapio-hoje?dia=${dia}`);
        const dados = await res.json();
        const c = (dados.cardapio || {})[tipo];
        const info = tipo === 'almoco'
            ? { emoji: '🌞', label: 'Almoço', horario: '11h – 14h' }
            : { emoji: '🌙', label: 'Jantar',  horario: '19h – 21h' };
        const labelDia = dia === 'amanha' ? 'de Amanhã' : 'de Hoje';

        let html = `<strong>${info.emoji} Cardápio do ${info.label} ${labelDia}</strong><br><span style="color:#9CA3AF;font-size:10px;">⏰ ${info.horario}</span><br><br>`;
        if (c) {
            if (c.prato_principal) html += `🥩 <b>Proteína:</b> ${c.prato_principal}<br>`;
            if (c.arroz)           html += `🍚 <b>Arroz:</b> ${c.arroz}<br>`;
            if (c.feijao)          html += `🫘 <b>Feijão:</b> ${c.feijao}<br>`;
            if (c.legumes)         html += `🥦 <b>Legumes:</b> ${c.legumes}<br>`;
            if (c.salada)          html += `🥗 <b>Salada:</b> ${c.salada}<br>`;
            if (c.sobremesa)       html += `🍮 <b>Sobremesa:</b> ${c.sobremesa}<br>`;
            if (c.observacao)      html += `🌿 <b>Vegetariano:</b> ${c.observacao}<br>`;
        } else {
            html += `<span style="color:#9CA3AF;">Cardápio ainda não cadastrado.</span>`;
        }
        addMsgBot(html);
    } catch {
        addMsgBot('Não consegui buscar o cardápio agora. 😕');
    }
    voltarMenu();
}

function verHorarios() {
    addMsgBot(`<strong>⏰ Horários do RU</strong><br><br>
        🌞 <b>Almoço:</b> 11h às 14h<br>
        🌙 <b>Jantar:</b> 19h às 21h<br><br>
        <span style="color:#6B7280;font-weight:600;">Segunda a sexta, exceto feriados.</span>`);
    voltarMenu();
}

async function verUltimasRefeicoes() {
    try {
        const res = await fetch('/aluno/historico-recente');
        const dados = await res.json();
        const refs = dados.refeicoes || [];

        if (refs.length === 0) {
            addMsgBot('Você ainda não registrou nenhuma refeição por aqui. 🍽️');
        } else {
            let html = `<strong>🧾 Últimas refeições</strong><br><br>`;
            refs.forEach(r => {
                const data = new Date(r.data_hora + 'Z');
                const dataFmt = data.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
                const horaFmt = data.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                const emoji = r.tipo === 'almoco' ? '🌞' : '🌙';
                const label = r.tipo === 'almoco' ? 'Almoço' : 'Jantar';
                const custo = parseFloat(r.custo) > 0 ? `R$ ${parseFloat(r.custo).toFixed(2).replace('.', ',')}` : 'gratuita';
                html += `${emoji} <b>${label}</b> — ${dataFmt} às ${horaFmt} · ${custo}<br>`;
            });
            html += `<br><span style="color:#9CA3AF;font-size:11px;">Histórico completo na tela inicial.</span>`;
            addMsgBot(html);
        }
    } catch {
        addMsgBot('Não consegui buscar seu histórico agora. 😕');
    }
    voltarMenu();
}

function verComoFuncionaCodigo() {
    addMsgBot(`<strong>📱 Código de acesso</strong><br><br>
        Na tela inicial tem o botão <b>"Mostrar código de acesso"</b> — ele gera um código que se renova sozinho a cada poucos segundos.<br><br>
        Mostre a tela pro funcionário na entrada do RU: ele lê o código e sua refeição já é registrada na hora. Cada código vale só uma vez, então print ou compartilhar não funciona. 🔒`);
    voltarMenu();
}

function verComoRecarregar() {
    addMsgBot(`<strong>💳 Como recarregar</strong><br><br>
        No botão <b>"Recarregar créditos"</b> da tela inicial, escolha um valor entre R$ 1,00 a R$ 500,00.<br><br>
        <b>💠 Pix:</b> gera um QR code e código copia-e-cola. O saldo entra automaticamente assim que o pagamento é aprovado.<br><br>
        <b>💳 Cartão:</b> escolha entre <b>crédito</b> ou <b>débito</b>, confirme seu CPF e os dados do cartão. Aprovação na hora. Da segunda vez em diante, seu cartão fica salvo e você só escolhe qual usar. 💰`);
    voltarMenu();
}

function mostrarNotas(callback) {
    const box = document.getElementById('bot-replies');
    box.innerHTML = '';
    for (let n = 1; n <= 5; n++) {
        const btn = document.createElement('button');
        btn.className = 'bot-option-btn';
        btn.innerHTML = `<span class="bot-option-icon">${n}</span><span class="bot-option-label">${'⭐'.repeat(n)}</span>`;
        btn.onclick = () => { box.innerHTML = ''; callback(n); };
        box.appendChild(btn);
    }
}

function mostrarCaixaTexto(callback, skipLabel = 'Pular') {
    const box = document.getElementById('bot-replies');
    box.innerHTML = `
        <input id="bot-input-texto" type="text" placeholder="Escreva aqui..."
               style="width:100%;box-sizing:border-box;padding:10px 14px;border-radius:14px;border:1px solid #EDE8E3;font-family:Inter,sans-serif;font-size:14px;margin-bottom:8px;">
        <div style="display:flex;gap:8px;">
            <button id="bot-btn-pular" class="bot-voltar-btn" style="flex:1;"><span>${skipLabel}</span></button>
            <button id="bot-btn-enviar" style="flex:1;background:linear-gradient(135deg,#F47920,#E03D3D);color:white;border:none;border-radius:14px;font-weight:700;font-size:14px;padding:11px 16px;cursor:pointer;font-family:Inter,sans-serif;">Enviar</button>
        </div>`;
    document.getElementById('bot-btn-pular').onclick = () => { box.innerHTML = ''; callback(''); };
    document.getElementById('bot-btn-enviar').onclick = () => {
        const val = document.getElementById('bot-input-texto').value.trim();
        box.innerHTML = '';
        callback(val);
    };
}

function verAvaliacao() {
    fetch('/aluno/avaliacao-pendente')
        .then(r => r.json())
        .then(dados => {
            if (!dados.pendente) {
                addMsgBot('Você não tem nenhuma refeição pendente pra avaliar no momento. 😊');
                voltarMenu();
                return;
            }
            addMsgBot('⭐ Qual nota você dá pra <b>comida</b> da sua última refeição?');
            mostrarNotas((notaComida) => {
                addMsgUser(`${notaComida} ⭐`);
                digitando().then(() => {
                    addMsgBot('E o <b>atendimento/serviço</b>, qual nota?');
                    mostrarNotas((notaServico) => {
                        addMsgUser(`${notaServico} ⭐`);
                        digitando().then(() => {
                            addMsgBot('Quer deixar uma sugestão? (opcional)');
                            mostrarCaixaTexto(async (sugestaoTexto) => {
                                addMsgUser(sugestaoTexto || 'Pular');
                                await digitando();
                                try {
                                    const res = await fetch('/aluno/avaliacao', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({
                                            nota_comida: notaComida,
                                            nota_servico: notaServico,
                                            sugestao: sugestaoTexto,
                                            csrf_token: '{{ csrf_token }}',
                                        }),
                                    });
                                    const d = await res.json();
                                    if (d.ok) addMsgBot('Obrigado pelo feedback! 😊 Sua opinião ajuda a melhorar o RU.');
                                    else addMsgBot('Não consegui registrar sua avaliação agora. Tenta de novo mais tarde.');
                                } catch {
                                    addMsgBot('Erro de conexão. Tenta de novo mais tarde.');
                                }
                                voltarMenu();
                            });
                        });
                    });
                });
            });
        })
        .catch(() => { addMsgBot('Não consegui verificar agora. Tenta de novo mais tarde.'); voltarMenu(); });
}

function verSugestao() {
    addMsgBot('💡 Manda sua sugestão pra gente:');
    mostrarCaixaTexto(async (texto) => {
        if (!texto) {
            addMsgUser('Cancelar');
            await digitando();
            addMsgBot('Sem problemas! Se mudar de ideia, é só chamar de novo. 😊');
            voltarMenu();
            return;
        }
        addMsgUser(texto);
        await digitando();
        try {
            const res = await fetch('/aluno/sugestao', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sugestao: texto, csrf_token: '{{ csrf_token }}' }),
            });
            const d = await res.json();
            if (d.ok) addMsgBot('Sugestão registrada, muito obrigado! 🙌');
            else addMsgBot('Não consegui registrar agora. Tenta de novo mais tarde.');
        } catch {
            addMsgBot('Erro de conexão. Tenta de novo mais tarde.');
        }
        voltarMenu();
    }, 'Cancelar');
}

function verContato() {
    addMsgBot(`<strong>💬 Fala com a gente</strong><br><br>
        Dúvida que eu não consigo resolver? Escreva o que você está enfrentando por email:<br><br>
        <a href="https://mail.google.com/mail/?view=cm&fs=1&to=meuru.ufcat@gmail.com&su=Suporte%20-%20Meu%20RU" target="_blank"
           style="display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,#F47920,#E03D3D);color:white;font-weight:700;font-size:12px;padding:8px 14px;border-radius:10px;text-decoration:none;margin-top:2px;">
            📧 meuru.ufcat@gmail.com
        </a>`);
    voltarMenu();
}

</script>
