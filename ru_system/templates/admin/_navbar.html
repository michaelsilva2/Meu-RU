<nav style="background-color: #1A1A1A;" class="shadow-lg">
    <div class="max-w-7xl mx-auto px-4">
        <div class="flex items-center justify-between h-16">

            <!-- Logo -->
            <div class="flex items-center gap-3">
                <img src="/static/img/favicon.png" alt="UFCAT" class="w-7 h-7">
                <span class="text-white font-bold text-base tracking-widest uppercase">Meu RU</span>
            </div>

            <!-- Links desktop -->
            <div class="hidden md:flex items-center gap-1">
                <a href="/admin/dashboard"
                   class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-medium transition
                          {% if request.url.path == '/admin/dashboard' %}text-white bg-white/10{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 opacity-60" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75"/>
                    </svg>
                    Início
                </a>
                <a href="/admin/alunos"
                   class="px-4 py-2 rounded-lg text-sm font-medium transition
                          {% if '/admin/alunos' in request.url.path %}text-white bg-white/10{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
                    Alunos
                </a>
                <a href="/admin/scanner"
                   class="px-4 py-2 rounded-lg text-sm font-medium transition
                          {% if request.url.path == '/admin/scanner' %}text-white bg-white/10{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
                    Scanner
                </a>
                <a href="/admin/historico"
                   class="px-4 py-2 rounded-lg text-sm font-medium transition
                          {% if request.url.path == '/admin/historico' %}text-white bg-white/10{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
                    Histórico
                </a>
                <a href="/admin/satisfacao"
                   class="px-4 py-2 rounded-lg text-sm font-medium transition
                          {% if request.url.path == '/admin/satisfacao' %}text-white bg-white/10{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
                    Satisfação
                </a>
                <a href="/admin/alertas"
                   class="px-4 py-2 rounded-lg text-sm font-medium transition
                          {% if request.url.path == '/admin/alertas' %}text-white bg-white/10{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
                    Alertas
                </a>
                <a href="/admin/cardapio"
                   class="px-4 py-2 rounded-lg text-sm font-medium transition
                          {% if request.url.path == '/admin/cardapio' %}text-white bg-white/10{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
                    Cardápio
                </a>
                {% if admin.role.value == 'super_admin' %}
                <a href="/admin/admins"
                   class="px-4 py-2 rounded-lg text-sm font-medium transition
                          {% if request.url.path == '/admin/admins' %}text-white bg-white/10{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
                    Admins
                </a>
                {% endif %}
            </div>

            <!-- Usuário + logout -->
            <div class="flex items-center gap-3">
                <span class="hidden sm:block text-white text-sm font-medium">{{ admin.nome.split()[0] }}</span>
                <button onclick="toggleDarkMode()" class="dm-icon text-gray-400 hover:text-white transition p-1.5 rounded-lg hover:bg-white/10"></button>
                <form method="POST" action="/admin/logout">
                    <button type="submit"
                        class="inline-flex items-center gap-1.5 text-xs font-bold uppercase tracking-wide px-3 py-1.5 rounded-lg transition-all duration-200"
                        style="color: #F47920; background: #F4792018;"
                        onmouseover="this.style.background='#F4792030'; this.style.boxShadow='0 0 0 2px #F4792035';"
                        onmouseout="this.style.background='#F4792018'; this.style.boxShadow='none';">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                        </svg>
                        Sair
                    </button>
                </form>
                <button onclick="toggleMenuMobile()" class="md:hidden text-gray-400 hover:text-white">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Menu mobile -->
    <div id="menu-mobile" class="hidden md:hidden px-4 pb-4" style="background-color: #111111;">
        <a href="/admin/dashboard" class="block text-gray-300 py-2.5 text-sm border-b border-white/5">Início</a>
        <a href="/admin/alunos" class="block text-gray-300 py-2.5 text-sm border-b border-white/5">Alunos</a>
        <a href="/admin/scanner" class="block text-gray-300 py-2.5 text-sm border-b border-white/5">Scanner</a>
        <a href="/admin/historico" class="block text-gray-300 py-2.5 text-sm border-b border-white/5">Histórico</a>
        <a href="/admin/satisfacao" class="block text-gray-300 py-2.5 text-sm border-b border-white/5">Satisfação</a>
        <a href="/admin/alertas" class="block text-gray-300 py-2.5 text-sm border-b border-white/5">Alertas</a>
        <a href="/admin/cardapio" class="block text-gray-300 py-2.5 text-sm border-b border-white/5">Cardápio</a>
        {% if admin.role.value == 'super_admin' %}
        <a href="/admin/admins" class="block text-gray-300 py-2.5 text-sm">Admins</a>
        {% endif %}
    </div>
</nav>
